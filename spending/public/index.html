<!DOCTYPE html>
<html lang="en">
<head>
    hopefully fixed
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Spending Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="modal-overlay">
    <div class="modal-box" id="modal-content"></div>
</div>

<div id="site-wrapper">
    <select id="year-select" onchange="changeYear(this.value)"></select>
    <button class="login-btn" id="auth-btn" onclick="openAuth()">Login</button>
    <aside id="months"></aside>
    <main>
        <nav>
            <div>
                <h2 id="title">--</h2>
                <div id="welcome-msg" style="font-size: 14px; color: #888;"></div>
            </div>
            <div id="clock">--:--:--</div>
        </nav>

        <div class="card">
            <div id="expense-form">
                <div style="display:flex; gap:10px;">
                    <select id="category" style="flex:1;"><option>Grocery</option><option>Eating Out</option><option>Object</option><option>Gas</option><option>Bills</option></select>
                    <input id="amount" type="number" placeholder="$" style="flex:1;">
                </div>
                <input id="name" placeholder="Item Name (max 20)" maxlength="20">
                <button onclick="submitExpense()">Add Entry</button>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Edit</th>
                        <th>Date</th>
                        <th>Item</th>
                        <th>Cat</th>
                        <th style="text-align:right;">$</th>
                        <th style="text-align:center;">X</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </main>
</div>
<script src="script.js"></script>
</body>
</html>
