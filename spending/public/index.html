<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Spending Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>      

<div id="modal-overlay">
    <div class="modal-box" id="modal-content"></div>
</div>

<div id="site-wrapper">
    <select id="year-select" onchange="changeYear(this.value)"></select>
    <button class="login-btn" id="auth-btn" onclick="openAuth()">Login</button>

    <aside id="months"></aside>

    <main>
        <nav>
            <div>
                <h2 id="title">--</h2>
                <div id="welcome-msg" style="font-size: 18px; color: #888; margin-top: 5px;"></div>
            </div>
            <div id="clock">--:--:--</div>
        </nav>

        <div class="card">
            <div id="expense-form">
                <select id="category">
                    <option value="Grocery">Grocery</option>
                    <option value="Eating Out">Eating Out</option>
                    <option value="Object">Object</option>
                    <option value="Gas">Gas</option>
                    <option value="Bills">Bills</option>
                </select>
                <input id="amount" type="number" placeholder="Amount ($)">
                <input id="name" placeholder="Name (optional)">
                <button onclick="submitExpense()">Add</button>
            </div>
        </div>

        <div class="card" id="weekly-stats">
            <h3 style="font-family: 'Source Serif 4', serif; font-size: 32px; margin-bottom: 20px;">Weekly Spending</h3>
            <table class="weekly-table">
                <thead>
                    <tr>
                        <th style="text-align: left;">Week</th>
                        <th style="text-align: right;">Total ($)</th>
                    </tr>
                </thead>
                <tbody id="weekly-rows"></tbody>
            </table>
        </div>

        <div class="table-wrapper">
            <h3 style="font-family: 'Source Serif 4', serif; font-size: 28px; margin-bottom: 10px;">Detailed Entries</h3>
            <table id="main-table">
                <thead>
                    <tr>
                        <th style="width: 80px;">Edit</th> 
                        <th style="width: 95px;">Date</th>
                        <th>Item</th>
                        <th style="width: 110px;">Category</th>
                        <th style="width: 90px; text-align: right;">Amount</th>
                        <th style="width: 60px; text-align: center;">X</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>
