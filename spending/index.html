<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spending Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<aside id="months"></aside>

<main>
  <nav>
    <h2 id="title"></h2>
    <div id="clock"></div>
  </nav>

  <div class="card" id="expense-form">
    <select id="category">
      <option value="grocery">Grocery</option>
      <option value="eating out">Eating Out</option>
      <option value="object">Object</option>
      <option value="gas">Gas</option>
    </select>
    <input id="amount" type="number" placeholder="Amount ($)">
    <input id="name" placeholder="Name (optional)">
    <button onclick="submitExpense()">Add</button>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th></th>
          <th>Date/Time</th>
          <th>Item</th>
          <th>Category</th>
          <th>Amount ($)</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <!-- Weekly stats -->
  <div class="card" id="weekly-stats">
    <h3>Weekly Spending</h3>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Week</th>
            <th>Total ($)</th>
          </tr>
        </thead>
        <tbody id="weekly-rows"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
