<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spending Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<aside id="months"></aside>

<main>
  <nav>
    <h2 id="title"></h2>
    <div id="clock"></div>
    <button id="login-btn" onclick="showLoginModal()">Login</button>
  </nav>

  <!-- Login Modal -->
  <div id="login-modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeLoginModal()">&times;</span>
      <h3 id="modal-title">Login / Register</h3>
      <input type="text" id="username" placeholder="Username">
      <input type="password" id="password" placeholder="Password">
      <div id="modal-buttons">
        <button onclick="login()">Login</button>
        <button onclick="register()">Register</button>
      </div>
      <p id="login-message"></p>
    </div>
  </div>

  <div class="card" id="expense-form">
    <select id="category">
      <option value="grocery">Grocery</option>
      <option value="eating out">Eating Out</option>
      <option value="object">Object</option>
      <option value="gas">Gas</option>
    </select>
    <input id="amount" type="number" placeholder="Amount ($)">
    <input id="name" placeholder="Name (optional)">
    <button onclick="submitExpense()">Add</button>
  </div>

  <div class="card" id="weekly-stats">
    <h3>Weekly Spending</h3>
    <table>
      <thead>
        <tr>
          <th>Week</th>
          <th>Total ($)</th>
        </tr>
      </thead>
      <tbody id="weekly-rows"></tbody>
    </table>
  </div>

  <table>
    <thead>
      <tr>
        <th></th>
        <th>Date/Time</th>
        <th>Item</th>
        <th>Category</th>
        <th>Amount ($)</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</main>

<script src="script.js"></script>
</body>
</html>
